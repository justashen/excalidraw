version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: excalidraw
      POSTGRES_PASSWORD: excalidraw_password
      POSTGRES_DB: excalidraw_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
